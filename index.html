<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malam Ini Mau Kemana?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        /* Barisan Nama Peserta di Menu Awal */
        .visitor-bar {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 30px;
            font-size: 1rem;
            max-width: 90%;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .visitor-tag {
            background-color: #ff4757;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 2px;
        }
        .delete-btn:hover {
            color: #121212;
        }
        .main-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .main-btn:hover {
            transform: scale(1.05);
            background-color: #ff6b81;
        }
        .options-container {
            display: none;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #ff4757;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #333;
            display: none; 
        }
        .card p {
            padding: 15px 15px 5px 15px;
            margin: 0;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .budget-text {
            display: none;
            padding: 0 15px 15px 15px;
            margin: 0;
            color: #ff4757;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .back-btn {
            display: none;
            margin-top: 30px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
        }
        .back-btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <!-- Bar Menu Awal untuk Daftar Nama Peserta yang Ikut -->
    <div class="visitor-bar" id="visitorBar">
        <span>👥 Peserta yang ikut: Memuat data...</span>
    </div>

    <!-- Judul & Tombol Utama -->
    <h1 id="title">MALAM INI MAU KEMANA?</h1>
    <button class="main-btn" id="startBtn">KLIK DI SINI</button>

    <!-- Kontainer Pilihan -->
    <div class="options-container" id="optionsMenu">
        
        <!-- Pilihan 1: Pergi Makan -->
        <div class="card" id="makanCard">
            <img src="pergi makan.png" alt="Pergi Makan">
            <p>Pergi Makan 🍔</p>
            <div class="budget-text">Min. Budget: 100.000 Riel</div>
        </div>

        <!-- Pilihan 2: Pergi Minum -->
        <div class="card" id="minumCard">
            <img src="MINUM.png" alt="Pergi Minum">
            <p>Pergi Minum 🥂</p>
            <div class="budget-text">Budget: 250.000 - 300.000 Riel</div>
        </div>

        <!-- Pilihan 3: Pergi Ngewe -->
        <div class="card" id="ngeweCard">
            <img src="NGEWE.webp" alt="Pergi Ngewe">
            <p>Pergi Ngewe 😈</p>
            <div class="budget-text">Min. Budget: 400.000 Riel</div>
        </div>

    </div>

    <button class="back-btn" id="backBtn">Pilih Lagi</button>

    <!-- Import Firebase Modules -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onValue, remove } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyA_l7yr43VChZHOTAUSFUgmqpQzApwQFWM",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "malam-ini-4cd0f",
            storageBucket: "://appspot.com",
            messagingSenderId: "787128930003",
            appId: "1:787128930003:web:fb89b68607d62710f94e26",
            measurementId: "G-T5D9TS30YP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const participantsRef = ref(db, 'participants');

        const startBtn = document.getElementById('startBtn');
        const optionsMenu = document.getElementById('optionsMenu');
        const visitorBar = document.getElementById('visitorBar');
        const backBtn = document.getElementById('backBtn');

        // Fungsi klik tombol utama KLIK DI SINI
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            optionsMenu.style.display = 'flex';
        });

        // Hubungkan fungsi klik ke setiap kartu
        document.getElementById('makanCard').addEventListener('click', function() {
            triggerOption(this, 'Pergi Makan', 'Min. Budget: 100.000 Riel');
        });
        document.getElementById('minumCard').addEventListener('click', function() {
            triggerOption(this, 'Pergi Minum', 'Budget: 250.000 - 300.000 Riel');
        });
        document.getElementById('ngeweCard').addEventListener('click', function() {
            triggerOption(this, 'Pergi Ngewe', 'Min. Budget: 400.000 Riel');
        });

        function triggerOption(cardElement, optionName, budgetInfo) {
            const img = cardElement.querySelector('img');
            const budget = cardElement.querySelector('.budget-text');
            img.style.display = 'block';
            budget.style.display = 'block';

            setTimeout(() => {
                let name = prompt(`Anda memilih "${optionName}" (${budgetInfo}).\n\nWajib isi nama Anda untuk ikut:`);
                
                while (name !== null && name.trim() === "") {
                    name = prompt("Nama tidak boleh kosong! Silakan masukkan nama Anda:");
                }

                if (name) {
                    push(participantsRef, {
                        name: name.trim(),
                        option: optionName
                    });
                    backBtn.style.display = 'inline-block';
                }
            }, 300);
        }

        // Baca data real-time dari Firebase cloud
        onValue(participantsRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                visitorBar.innerHTML = '<span>👥 Peserta yang ikut: Belum ada</span>';
                return;
            }

            visitorBar.innerHTML = '<span>👥 Peserta yang ikut: </span>';
            Object.keys(data).forEach((key) => {
                const p = data[key];
                
                const tag = document.createElement('span');
                tag.className = 'visitor-tag';
                tag.textContent = `${p.name} (${p.option}) `;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Mencegah memicu klik kartu di belakangnya
                    if (confirm(`Hapus nama "${p.name}" dari daftar?`)) {
                        remove(ref(db, `participants/${key}`));
                    }
                });
                
                tag.appendChild(delBtn);
                visitorBar.appendChild(tag);
            });
        });

        // Tombol kembali
        backBtn.addEventListener('click', () => {
            optionsMenu.style.display = 'none';
            backBtn.style.display = 'none';
            startBtn.style.display = 'inline-block';
            document.querySelectorAll('.card img').forEach(img => img.style.display = 'none');
            document.querySelectorAll('.budget-text').forEach(b => b.style.display = 'none');
        });
    </script>
</body>
</html>
