<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malam Ini Mau Kemana?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .main-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .main-btn:hover {
            transform: scale(1.05);
            background-color: #ff6b81;
        }
        .options-container {
            display: none;
            margin-top: 40px;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #333;
        }
        .card p {
            padding: 15px;
            margin: 0;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Tombol Utama -->
    <h1 id="title">MALAM INI MAU KEMANA?</h1>
    <button class="main-btn" id="startBtn">KLIK DI SINI</button>

    <!-- Kontainer Pilihan (Muncul setelah diklik) -->
    <div class="options-container" id="optionsMenu">
        
        <!-- Pilihan 1: Pergi Makan -->
        <div class="card">
            <img src="makan.jpg" alt="Pergi Makan">
            <p>Pergi Makan 🍔</p>
        </div>

        <!-- Pilihan 2: Pergi Minum -->
        <div class="card">
            <img src="minum.jpg" alt="Pergi Minum">
            <p>Pergi Minum 🥂</p>
        </div>

        <!-- Pilihan 3: Pergi Ngewe -->
        <div class="card">
            <img src="ngewe.jpg" alt="Pergi Ngewe">
            <p>Pergi Ngewe 😈</p>
        </div>

    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const optionsMenu = document.getElementById('optionsMenu');

        startBtn.addEventListener('click', () => {
            // Sembunyikan tombol klik setelah ditekan
            startBtn.style.display = 'none';
            // Tampilkan pilihan lampiran foto & teks
            optionsMenu.style.display = 'flex';
        });
    </script>

</body>
</html>
