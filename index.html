<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malam Ini Mau Kemana?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        .visitor-bar, h1, .main-btn, .options-container, .back-btn {
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
        }
        .visitor-bar {
            background-color: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 30px;
            font-size: 1rem;
            max-width: 90%;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .visitor-tag {
            background-color: #ff4757;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: popIn 0.3s ease forwards;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .delete-btn {
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 2px;
        }
        .delete-btn:hover {
            color: #121212;
        }
        .main-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.6);
            transition: transform 0.2s, background-color 0.2s;
        }
        .main-btn:hover {
            transform: scale(1.05);
            background-color: #ff6b81;
        }
        .options-container {
            display: none;
            margin-top: 20px;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            padding: 20px;
            animation: fadeInUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card {
            background-color: rgba(30, 30, 30, 0.85);
            border-radius: 15px;
            overflow: hidden;
            width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            border: 1px solid #444;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s;
            position: relative;
            backdrop-filter: blur(5px);
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff4757;
            box-shadow: 0 12px 24px rgba(255, 71, 87, 0.4);
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #333;
            display: none; 
            animation: fadeIn 0.4s ease forwards;
        }
        .card p {
            padding: 15px 15px 5px 15px;
            margin: 0;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .budget-text {
            display: none;
            padding: 0 15px 15px 15px;
            margin: 0;
            color: #ff4757;
            font-weight: bold;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .back-btn {
            display: none;
            margin-top: 30px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            animation: fadeIn 0.5s ease forwards;
        }
        .back-btn:hover {
            background-color: #444;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="visitor-bar" id="visitorBar">
        <span>👥 Peserta yang ikut: Belum ada</span>
    </div>

    <h1 id="title">MALAM INI MAU KEMANA?</h1>
    <button class="main-btn" id="startBtn">KLIK DI SINI</button>

    <div class="options-container" id="optionsMenu">
        <div class="card" onclick="triggerOption(this, 'Pergi Makan', 'Min. Budget: 100.000 Riel')">
            <img src="pergi makan.png" alt="Pergi Makan">
            <p>Pergi Makan 🍔</p>
            <div class="budget-text">Min. Budget: 100.000 Riel</div>
        </div>

        <div class="card" onclick="triggerOption(this, 'Pergi Minum', 'Budget: 250.000 - 300.000 Riel')">
            <img src="MINUM.png" alt="Pergi Minum">
            <p>Pergi Minum 🥂</p>
            <div class="budget-text">Budget: 250.000 - 300.000 Riel</div>
        </div>

        <div class="card" onclick="triggerOption(this, 'Pergi Ngewe', 'Min. Budget: 400.000 Riel')">
            <img src="NGEWE.webp" alt="Pergi Ngewe">
            <p>Pergi Ngewe 😈</p>
            <div class="budget-text">Min. Budget: 400.000 Riel</div>
        </div>
    </div>

    <button class="back-btn" id="backBtn">Pilih Lagi</button>

    <script>
        const startBtn = document.getElementById('startBtn');
        const optionsMenu = document.getElementById('optionsMenu');
        const visitorBar = document.getElementById('visitorBar');
        const backBtn = document.getElementById('backBtn');

        const hornSound = new Audio('https://mixkit.co'); 
        const coinSound = new Audio('https://mixkit.co');   

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            optionsMenu.style.display = 'flex';
        });

        let participants = JSON.parse(localStorage.getItem('malamIniParticipants')) || [];
        updateVisitorDisplay();

        function triggerOption(cardElement, optionName, budgetInfo) {
            hornSound.currentTime = 0;
            hornSound.play().catch(e => console.log("Menunggu interaksi pertama"));

            const img = cardElement.querySelector('img');
            const budget = cardElement.querySelector('.budget-text');
            img.style.display = 'block';
            budget.style.display = 'block';

            setTimeout(() => {
                let name = prompt(`Anda memilih "${optionName}" (${budgetInfo}).\n\nWajib isi nama Anda untuk ikut:`);
                
                while (name !== null && name.trim() === "") {
                    name = prompt("Nama tidak boleh kosong! Silakan masukkan nama Anda:");
                }

                if (name) {
                    coinSound.currentTime = 0;
                    coinSound.play().catch(e => console.log("Menunggu interaksi pertama"));

                    participants.push({
                        name: name.trim(),
                        option: optionName
                    });
                    
                    localStorage.setItem('malamIniParticipants', JSON.stringify(participants));
                    updateVisitorDisplay();
                    
                    backBtn.style.display = 'inline-block';
                }
            }, 300);
        }

        function updateVisitorDisplay() {
            if (participants.length === 0) {
                visitorBar.innerHTML = '<span>👥 Peserta yang ikut: Belum ada</span>';
                return;
            }

            visitorBar.innerHTML = '<span>👥 Peserta yang ikut: </span>';
            participants.forEach((p, index) => {
                const tag = document.createElement('span');
                tag.className = 'visitor-tag';
                tag.textContent = `${p.name} (${p.option}) `;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                delBtn.onclick = function(e) {
                    e.stopPropagation();
                    if (confirm(`Hapus nama "${p.name}" dari daftar?`)) {
                        participants.splice(index, 1);
